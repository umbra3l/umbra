# umbra v2 configuration. Sourced by bin/umbra as bash.
#
# These are the shipped defaults. Don't edit them for one machine: put your
# settings in umbra.local.conf next to this file (gitignored; start from
# umbra.local.conf.example). It is read first, and every line below only
# fills in what it left unset.
#
# Every setting uses ': "${VAR:=default}"' so an environment variable of the
# same name wins for one run (UMBRA_NET=open claude). Most settings can be
# scoped to one tool by suffixing its name (UMBRA_VM_RAM_opencode=16384).
# Command-line flags (umbra run --net=open claude) beat both.

# ---- network -------------------------------------------------------------
# ask     (default) the VM can reach nothing but umbra's egress proxy. Tool
#         APIs, GitHub and package registries are pre-allowed
#         (egress/defaults.allow); any other domain pops a notification:
#         [Allow once] [Always allow <domain>] [Deny]. No DNS, no direct
#         connections, never your LAN or this laptop's local services.
# strict  like ask, but unknown domains are refused without asking.
# open    full internet except LAN / link-local / cloud metadata / localhost.
# host    the VM shares your network, including localhost (used by
#         `umbra login` for OAuth callbacks).
# none    no network.
: "${UMBRA_NET:=ask}"
# In "open" mode, also allow the LAN.
: "${UMBRA_ALLOW_LAN:=0}"

# ---- VM ------------------------------------------------------------------
# vCPUs and RAM (MiB). Boot time grows with vCPUs (~25 ms each); 0 means all
# host CPUs. RAM is a ceiling, not a reservation: it is only used as needed.
: "${UMBRA_VM_CPUS:=4}"
: "${UMBRA_VM_RAM:=4096}"

# ---- project safety ------------------------------------------------------
# Snapshot the project (btrfs reflink: instant, no extra space) before each
# session, so `umbra undo` can roll back anything the agent did. Regenerable
# dirs (node_modules, .venv, Rust target/, ...) are skipped.
: "${UMBRA_SNAPSHOT:=1}"
: "${UMBRA_SNAPSHOT_KEEP:=20}"
# .git/config and .git/hooks are read-only inside: host git *executes* them
# (hooks, core.fsmonitor, core.hooksPath, filters, aliases). Side effect:
# `git remote add`, `git push -u`, `git branch -u` fail inside; run those on
# the host or pass --no-git-protect.
: "${UMBRA_GIT_PROTECT:=1}"
# Mount the git root containing $PWD (so git works from subdirectories).
: "${UMBRA_GIT_ROOT:=1}"

# ---- integration ---------------------------------------------------------
# bridge  images from your clipboard are pasteable in the VM; whatever the
#         agent copies reaches your clipboard. Text you copy is never visible
#         to the agent (paste text with the terminal as usual).
# off     terminal only (OSC 52 copy, bracketed paste).
: "${UMBRA_CLIPBOARD:=bridge}"
# GitHub token (from `gh auth token`) + git credential helper inside, so the
# agent can push and use gh. Per session: umbra run --gh claude
: "${UMBRA_GH:=0}"

# ---- extra mounts --------------------------------------------------------
# Mounted at the same path if they exist; read-only unless listed under
# UMBRA_RW_BINDS. Never add anything the host executes as read-write.
if [ -z "${UMBRA_RO_BINDS+x}" ]; then
    UMBRA_RO_BINDS=(
        "$HOME/.config/nvim"          # $EDITOR inside the VM = your nvim
        "$HOME/.local/share/nvim"     # nvim plugins
        "$HOME/.config/git/ignore"    # global gitignore
    )
fi
if [ -z "${UMBRA_RW_BINDS+x}" ]; then
    UMBRA_RW_BINDS=()
fi

# ---- per-tool additions --------------------------------------------------
# Suffix UMBRA_RO_BINDS / UMBRA_RW_BINDS / UMBRA_PASS_ENV with a tool name to
# add something for that tool only. Secrets for one tool go in
# ~/.config/umbra/secrets/<tool>.env (mode 600, KEY=VALUE lines): loaded into
# that tool's VM environment and nowhere else.
#
# Example: an MCP server binary that lives outside the project, for opencode
# only, with its token in secrets/opencode.env:
#   UMBRA_RO_BINDS_opencode=("$HOME/bin/github-mcp-server")

# ---- environment ---------------------------------------------------------
# The VM starts from an EMPTY environment. Terminal/locale variables and
# these patterns pass through when set on the host. Your shell exports
# secrets globally (e.g. GITHUB_PERSONAL_ACCESS_TOKEN); those stay out
# unless you list them.
if [ -z "${UMBRA_PASS_ENV+x}" ]; then
    UMBRA_PASS_ENV=(
        'ANTHROPIC_*' 'CLAUDE_CODE_USE_*' 'CLAUDE_CODE_MAX_OUTPUT_TOKENS' 'MAX_THINKING_TOKENS'
        'OPENAI_*' 'GEMINI_*' 'GOOGLE_API_KEY' 'GOOGLE_GENAI_*' 'GOOGLE_CLOUD_PROJECT'
        'OPENROUTER_*' 'GROQ_API_KEY' 'DEEPSEEK_API_KEY' 'XAI_API_KEY' 'MISTRAL_API_KEY'
        'OPENCODE_*' 'AGY_*'
        'DISABLE_TELEMETRY' 'DO_NOT_TRACK' 'NO_COLOR' 'FORCE_COLOR'
    )
fi

# ---- hardening -----------------------------------------------------------
# seccomp denylist on the VMM process (seccomp/umbra-seccomp.c). Leave on.
: "${UMBRA_SECCOMP:=1}"

# ---- locations -----------------------------------------------------------
# Per-tool homes: $UMBRA_STATE/home/<tool>; snapshots: $UMBRA_STATE/snapshots
: "${UMBRA_STATE:=${XDG_DATA_HOME:-$HOME/.local/share}/umbra}"
# Old ai-sandbox directory, for `umbra import <tool> v1`.
: "${UMBRA_V1_DIR:=$HOME/.local/share/ai-sandbox}"
